name: PiDelta Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: pidelta-bot
  cancel-in-progress: false

env:
  OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
  OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
  OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
  OKX_DEMO: ${{ secrets.OKX_DEMO != '' && secrets.OKX_DEMO || 'true' }}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Limpiar bloqueos residuales
        run: |
          rm -f .lock

      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache de pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar variables de entorno
        run: |
          echo "Verificando variables de entorno..."
          if [ -z "$OKX_API_KEY" ]; then echo "❌ OKX_API_KEY no está definido"; exit 1; fi
          if [ -z "$OKX_SECRET_KEY" ]; then echo "❌ OKX_SECRET_KEY no está definido"; exit 1; fi
          if [ -z "$OKX_PASSPHRASE" ]; then echo "❌ OKX_PASSPHRASE no está definido"; exit 1; fi
          echo "✅ Todas las variables de entorno están definidas."

      - name: Ejecutar bot
        id: run_bot
        run: |
          echo "🚀 Iniciando bot en $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python main.py
          EXIT_CODE=$?
          echo "🏁 Bot finalizado a las $(date -u '+%Y-%m-%d %H:%M:%S UTC') con código $EXIT_CODE"
          exit $EXIT_CODE

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
        continue-on-error: true

      - name: Notificar fallo
        if: failure()
        run: |
          echo "❌ El bot ha fallado en la ejecución ${{ github.run_id }}"
          echo "📋 Revisa los logs en el artefacto adjunto."
